<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">XuniaDAO system map</title><desc id="desc">Flow-native token registry integration. Animated signals move between four stages; motion stops when reduced motion is preferred.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050716"/><stop offset=".52" stop-color="#12052b"/><stop offset="1" stop-color="#001f2b"/></linearGradient>
<linearGradient id="beam"><stop stop-color="#00e5ff"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#ff3df2"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
text{font-family:Inter,Segoe UI,Arial,sans-serif}.eyebrow{font-size:14px;fill:#79f7ff;letter-spacing:4px}.hero{font-size:42px;font-weight:800;fill:white}.sub{font-size:17px;fill:#b7c5dd}.card{fill:#0b1025;stroke:url(#beam);stroke-width:2}.num{font-size:13px;fill:#79f7ff}.label{font-size:19px;font-weight:700;fill:white}.hint{font-size:13px;fill:#9eacd0}.path{stroke:url(#beam);stroke-width:4;fill:none;stroke-dasharray:10 12;animation:flow 1.4s linear infinite}.orb{fill:#fff;filter:url(#glow)}@keyframes flow{to{stroke-dashoffset:-44}}@keyframes pulse{50%{opacity:.35}}.ring{animation:pulse 2s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.path,.ring{animation:none}}
</style></defs>
<rect width="1200" height="520" rx="30" fill="url(#bg)"/><circle class="ring" cx="1080" cy="90" r="70" fill="none" stroke="#a855f7" opacity=".5"/><circle class="ring" cx="1080" cy="90" r="42" fill="none" stroke="#00e5ff" opacity=".6"/>
<text x="70" y="72" class="eyebrow">SONOXO // SYSTEM VISUAL</text><text x="70" y="126" class="hero">XuniaDAO</text><text x="70" y="160" class="sub">Flow-native token registry integration</text>
<path class="path" d="M225 322H375M525 322H675M825 322H975"/>
<g><rect class="card" x="55" y="250" width="230" height="145" rx="20"/><text x="79" y="282" class="num">01</text><text x="79" y="322" class="label">SUBMIT</text><text x="79" y="350" class="hint">Add token metadata</text></g><g><rect class="card" x="355" y="250" width="230" height="145" rx="20"/><text x="379" y="282" class="num">02</text><text x="379" y="322" class="label">VALIDATE</text><text x="379" y="350" class="hint">Check schema + assets</text></g><g><rect class="card" x="655" y="250" width="230" height="145" rx="20"/><text x="679" y="282" class="num">03</text><text x="679" y="322" class="label">PUBLISH</text><text x="679" y="350" class="hint">Build token lists</text></g><g><rect class="card" x="955" y="250" width="230" height="145" rx="20"/><text x="979" y="282" class="num">04</text><text x="979" y="322" class="label">CONSUME</text><text x="979" y="350" class="hint">Apps fetch registry</text></g>
<text x="70" y="466" class="sub">One clear path. Every stage stays observable.</text><circle class="orb" cx="375" cy="322" r="5"/><circle class="orb" cx="675" cy="322" r="5"/><circle class="orb" cx="975" cy="322" r="5"/></svg>