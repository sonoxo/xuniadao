<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#0b0d12"/><title>The Black House — Resilience Simulation</title><script type="module" src="/src/main.ts"></script><style>html,body,#app{width:100%;height:100%;margin:0;overflow:hidden;background:#0b0d12;color:#e8eaef;font-family:Inter,system-ui,sans-serif}#app{display:flex}#stage{position:relative;flex:1;min-width:0;height:100%}#viewport{position:absolute;inset:0}#panel{flex:0 0 300px;width:300px;height:100%;background:#18181b;padding:18px;box-sizing:border-box;border-left:1px solid #2a2d33}#place-search{position:absolute;z-index:3;top:28px;left:50%;width:min(640px,calc(100% - 48px));transform:translateX(-50%);display:flex;gap:12px}#place-search input,#place-search select,#panel select,#panel button{background:#111319;border:1px solid #353945;color:#eef1f6;border-radius:10px;padding:12px}#place-search input{flex:1}#hints{position:absolute;left:18px;bottom:18px;z-index:2;background:#111319cc;padding:8px 12px;border-radius:10px;font-size:12px}#brand{font-weight:800;letter-spacing:.12em;font-size:13px;margin-bottom:18px}.metric{display:flex;justify-content:space-between;border-bottom:1px solid #2b2f36;padding:12px 0}.danger{color:#ff6b6b}.good{color:#7cff9d}.cta{width:100%;margin-top:12px}.small{font-size:12px;color:#aab2c0;line-height:1.5}@media(max-width:820px){html,body,#app{height:100dvh}#panel{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;max-height:42vh;overflow:auto;z-index:4;border-left:0;border-top:1px solid #2a2d33}}</style></head><body><div id="app"><div id="stage"><div id="viewport"></div><form id="place-search"><input id="place" type="search" placeholder="Search a city or place" aria-label="Search a city or place"/><select id="preset"><option value="richmond">Richmond, VA</option><option value="dc">Washington, DC</option><option value="norfolk">Norfolk, VA</option></select></form><div id="hints">Left drag orbit · Right drag pan · Scroll zoom · H home</div></div><aside id="panel"><div id="brand">THE BLACK HOUSE / XUNIA</div><label>Exercise severity<select id="severity"><option value="1">Localized</option><option value="2">Significant</option><option value="3" selected>Major</option><option value="4">Regional</option><option value="5">Catastrophic exercise</option></select></label><button id="run" class="cta">RUN RESILIENCE EXERCISE</button><div class="metric"><span>Population band</span><strong id="pop">—</strong></div><div class="metric"><span>Hospital surge</span><strong id="hosp">—</strong></div><div class="metric"><span>Infrastructure risk</span><strong id="infra">—</strong></div><div class="metric"><span>Posture</span><strong id="posture" class="good">READY</strong></div><button id="brief" class="cta">GPT-DOUG / VIRGINIA BRIEF</button><pre id="briefing" class="small"></pre><p class="small">Civil-defense training only. No targeting, weapon engineering, yield optimization, strike sequencing, or casualty maximization.</p></aside></div></body></html>
