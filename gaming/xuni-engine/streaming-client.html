<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XUNI Streaming Client</title><style>body{margin:0;background:#050912;color:#d9f7ff;font-family:system-ui}main{display:grid;place-items:center;min-height:100vh}.panel{width:min(900px,92vw)}canvas{width:100%;aspect-ratio:16/9;background:#0a1324;border:1px solid #1de9b6}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button{background:#0e2238;color:#fff;border:1px solid #1de9b6;padding:10px 14px}.stat{font-family:monospace;white-space:pre-wrap;background:#09111e;padding:10px}</style></head><body><main><div class="panel"><h1>XUNI STREAMING CORE</h1><div class="row"><button id="play">PLAY</button><button id="suspend">SUSPEND</button><button id="resume">RESUME</button></div><canvas id="view" width="1280" height="720"></canvas><div id="stat" class="stat">IDLE</div></div></main><script type="module">const API='http://127.0.0.1:8787',c=document.querySelector('#view'),ctx=c.getContext('2d'),stat=document.querySelector('#stat');let session=null,events=null,seq=0;async function call(path,body={}){const r=await fetch(API+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||'request failed');return j}function connect(){events?.close();events=new EventSource(`${API}/api/sessions/${session.id}/events`);events.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='frame')draw(m.state);if(m.type==='session')stat.textContent=JSON.stringify(m.session,null,2)}}function draw(s){ctx.fillStyle='#07101c';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#16e0bd';ctx.fillRect((s.x%10)/10*c.width-18,(s.y%10)/10*c.height-18,36,36);ctx.fillStyle='#fff';ctx.font='24px monospace';ctx.fillText(`FRAME ${s.frame}  SCORE ${s.score}`,24,40)}document.querySelector('#play').onclick=async()=>{session=await call('/api/sessions',{playerId:'local-player',titleId:'neon-deck-arena',entitlement:true});connect();session=await call(`/api/sessions/${session.id}/allocate`,{rttMs:20,packetLoss:0,bandwidthMbps:50});stat.textContent=JSON.stringify(session,null,2)};document.querySelector('#suspend').onclick=async()=>{if(session)session=await call(`/api/sessions/${session.id}/suspend`);stat.textContent=JSON.stringify(session,null,2)};document.querySelector('#resume').onclick=async()=>{if(session){connect();session=await call(`/api/sessions/${session.id}/resume`,{rttMs:25,packetLoss:.01,bandwidthMbps:25});stat.textContent=JSON.stringify(session,null,2)}};const keys=new Set;addEventListener('keydown',e=>keys.add(e.code));addEventListener('keyup',e=>keys.delete(e.code));setInterval(async()=>{if(!session||session.state!=='STREAMING')return;const gp=navigator.getGamepads?.()[0];const moveX=gp?.axes?.[0]??((keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0)),moveY=-(gp?.axes?.[1]??0)||((keys.has('KeyW')?1:0)-(keys.has('KeyS')?1:0)),lookX=gp?.axes?.[2]??0,fire=!!gp?.buttons?.[7]?.pressed||keys.has('Space');try{await call(`/api/sessions/${session.id}/input`,{seq:++seq,sentAt:Date.now(),moveX,moveY,lookX,fire})}catch{}},50);</script></body></html>
