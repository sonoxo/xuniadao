<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XUNI // Neon Deck Arena</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b12;color:#fff;font-family:Inter,system-ui,sans-serif}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:18px;font-weight:800}.brand{letter-spacing:.2em}.score{position:absolute;right:18px;top:58px;background:#07131dde;border:1px solid #2f5876;border-radius:12px;padding:12px}.score th,.score td{padding:3px 10px;text-align:left}.panel{pointer-events:auto;position:fixed;inset:0;display:grid;place-items:center;background:#02070dbd;backdrop-filter:blur(8px)}.box{width:min(860px,92vw);padding:28px;border-radius:18px;border:1px solid #315570;background:#07131df2}.hidden{display:none!important}.classes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid #294b65;border-radius:14px;padding:18px;background:#0b1b28;cursor:pointer}.card:hover,.card.selected{border-color:#53f0cc}.muted{color:#8aa6b9}button{border:0;border-radius:10px;padding:11px 16px;font-weight:800;background:#53f0cc;color:#06120f;cursor:pointer}button.secondary{background:#193145;color:#d8ecf7}.row{display:flex;gap:10px;flex-wrap:wrap}#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:auto;font-size:18px;padding:16px 26px}.help{position:absolute;left:18px;bottom:18px;color:#8aa6b9;font-size:13px}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="top"><div class="brand">XUNI // NEON DECK</div><div id="status">CLICK PLAY</div></div><div class="score"><b>FREE FOR ALL</b><table><thead><tr><th>Player</th><th>K</th><th>D</th></tr></thead><tbody id="score"></tbody></table></div><div class="help">WASD move • mouse aim • click fire • R reload • Esc pause</div><button id="start">CLICK TO PLAY</button></div><div id="classMenu" class="panel hidden"><div class="box"><div class="muted">XUNI TEST GAME 001</div><h1>Create a class</h1><div class="classes"><div class="card" data-class="pulse"><h3>Pulse AR</h3><div>Automatic • 720 RPM</div></div><div class="card" data-class="marksman"><h3>Vektor Semi</h3><div>Semi • 360 RPM</div></div><div class="card" data-class="burst"><h3>Triad Burst</h3><div>Burst profile • 600 RPM</div></div></div><br><button id="equip" disabled>Equip & Deploy</button></div></div><div id="pause" class="panel hidden"><div class="box"><h1>Paused</h1><div class="row"><button id="resume">Resume</button><button class="secondary" id="classAgain">Create a class</button><button class="secondary" id="respawn">Respawn</button><button class="secondary" id="nav">Navmesh overlay</button><button class="secondary" id="collision">Collision overlay</button></div></div></div><script type="module" src="./src/game.js"></script></body></html>
