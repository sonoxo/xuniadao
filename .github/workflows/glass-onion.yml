name: Glass Onion Ecosystem Gate

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/ecosystem.ts'
      - 'src/lib/ecosystem.spec.ts'
      - 'src/lib/va3lm.ts'
      - 'src/lib/super-agent.ts'
      - 'src/lib/sagi.ts'
      - 'src/lib/sagi.spec.ts'
      - 'src/lib/quantum-ontology.ts'
      - 'src/index.ts'
      - 'cadence/**'
      - 'ecosystem/**'
      - 'docs/VA3LM-SAGI.md'
      - 'docs/GOOD_FIRST_ISSUES.md'
      - 'CONTRIBUTING.md'
      - 'CONTRIBUTORS.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'scripts/glass-onion-bootstrap.sh'
      - 'README.md'
      - '.github/workflows/glass-onion.yml'
  pull_request:
    paths:
      - 'src/lib/ecosystem.ts'
      - 'src/lib/ecosystem.spec.ts'
      - 'src/lib/va3lm.ts'
      - 'src/lib/super-agent.ts'
      - 'src/lib/sagi.ts'
      - 'src/lib/sagi.spec.ts'
      - 'src/lib/quantum-ontology.ts'
      - 'src/index.ts'
      - 'cadence/**'
      - 'ecosystem/**'
      - 'docs/VA3LM-SAGI.md'
      - 'docs/GOOD_FIRST_ISSUES.md'
      - 'CONTRIBUTING.md'
      - 'CONTRIBUTORS.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'scripts/glass-onion-bootstrap.sh'
      - 'README.md'
      - '.github/workflows/glass-onion.yml'

jobs:
  glass-onion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: TypeScript build
        run: yarn build:main

      - name: Unit tests
        run: yarn test:unit

      - name: Ecosystem lock
        run: |
          node <<'NODE'
          const assert = require('assert');
          const { GLASS_ONION, getXuniaLayer } = require('./dist/main/lib/ecosystem');
          assert.equal(GLASS_ONION.codename, 'GLASS ONION');
          assert.equal(GLASS_ONION.umbrella, 'XUNIA');
          assert.deepEqual(GLASS_ONION.layers.map(x => x.id), [
            'xunia', 'zyra', 'sonoxo', 'almighty-sonoxo', 'va3lm'
          ]);
          assert.equal(getXuniaLayer('va3lm').runtime, 'http://127.0.0.1:8088');
          assert.equal(GLASS_ONION.rules.humanApprovalForMutation, true);
          assert.equal(GLASS_ONION.rules.automaticFundMovement, false);
          assert.equal(GLASS_ONION.rules.automaticGovernanceVoting, false);
          assert.equal(GLASS_ONION.rules.arbitraryRemoteShell, false);
          assert.equal(GLASS_ONION.rules.provenanceRequired, true);
          console.log('GLASS ONION ECOSYSTEM LOCK: PASS');
          NODE

      - name: SAGI super-agent lock
        run: |
          node <<'NODE'
          const assert = require('assert');
          const { SAGI, evaluateSAGI } = require('./dist/main/lib/sagi');
          const { SUPER_AGENT } = require('./dist/main/lib/super-agent');
          const { buildQuantumOntologySpeedRun } = require('./dist/main/lib/quantum-ontology');
          assert.equal(SAGI.command, '/VA3LM-SAGI');
          assert.equal(SAGI.expandedName, 'SUPER ARTIFICIAL GUARDRAIL INTELLIGENCE');
          assert.equal(SUPER_AGENT.runtime, 'http://127.0.0.1:8088');
          assert.ok(SUPER_AGENT.capabilities.includes('CADENCE_FLOW'));
          assert.ok(SUPER_AGENT.capabilities.includes('PALANTIR_ACTION_MODEL'));
          assert.ok(SUPER_AGENT.capabilities.includes('IBM_QUANTUM_BLUEPRINT'));
          assert.equal(evaluateSAGI({ capability: 'CODE_GENERATION' }).decision, 'ALLOW');
          assert.equal(evaluateSAGI({ capability: 'CODE_GENERATION', mutatesRepository: true }).decision, 'REVIEW');
          assert.equal(evaluateSAGI({ capability: 'CADENCE_FLOW', movesFunds: true }).decision, 'BLOCK');
          const q = buildQuantumOntologySpeedRun({
            id: 'ci',
            primitive: 'SamplerV2',
            objective: 'CI blueprint',
            circuitRefs: ['circuit:ci']
          });
          assert.equal(q.actionState, 'REVIEW_REQUIRED');
          assert.equal(q.objects[1].properties.primitive, 'SamplerV2');
          console.log('VA3LM-SAGI SUPER AGENT LOCK: PASS');
          NODE

      - name: Manifest lock
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const manifest = JSON.parse(fs.readFileSync('ecosystem/glass-onion.json', 'utf8'));
          const sagi = JSON.parse(fs.readFileSync('ecosystem/va3lm-sagi.json', 'utf8'));
          assert.equal(manifest.codename, 'GLASS ONION');
          assert.equal(manifest.layers.length, 5);
          assert.equal(manifest.layers.find(x => x.id === 'va3lm').runtime, 'http://127.0.0.1:8088');
          assert.equal(sagi.command, '/VA3LM-SAGI');
          assert.deepEqual(sagi.stack.ibmQuantum.primitives, ['SamplerV2', 'EstimatorV2']);
          assert.equal(sagi.commandGates.automaticFundMovement, 'BLOCKED');
          console.log('GLASS ONION + SAGI MANIFEST: PASS');
          NODE

      - name: Cadence lane lock
        run: |
          test -f cadence/contracts/XuniaIntent.cdc
          grep -q 'contract XuniaIntent' cadence/contracts/XuniaIntent.cdc
          grep -q 'IntentSubmitted' cadence/contracts/XuniaIntent.cdc
          echo 'CADENCE / FLOW LANE: PASS'

      - name: Contributor lane lock
        run: |
          test -f CONTRIBUTING.md
          test -f CONTRIBUTORS.md
          test -f docs/GOOD_FIRST_ISSUES.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          grep -q 'Flow / Cadence' CONTRIBUTING.md
          grep -q 'GF-001' docs/GOOD_FIRST_ISSUES.md
          grep -q 'Community contributors' CONTRIBUTORS.md
          echo 'GLASS ONION CONTRIBUTOR LANES: PASS'

      - name: Bootstrap syntax
        run: bash -n scripts/glass-onion-bootstrap.sh
