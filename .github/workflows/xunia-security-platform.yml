name: XUNIA Security Platform

on:
  pull_request:
    paths:
      - "src/lib/security-engagement.ts"
      - "src/lib/security-engagement.spec.ts"
      - "src/lib/security-runtime.ts"
      - "src/lib/security-runtime.spec.ts"
      - "src/schemas/security-engagement.schema.json"
      - "src/index.ts"
      - ".github/workflows/xunia-security-platform.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/security-engagement.ts"
      - "src/lib/security-engagement.spec.ts"
      - "src/lib/security-runtime.ts"
      - "src/lib/security-runtime.spec.ts"
      - "src/schemas/security-engagement.schema.json"
      - "src/index.ts"

permissions:
  contents: read

jobs:
  contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test:unit
