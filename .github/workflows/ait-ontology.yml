name: AIT Ontology Lock

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/ait-ontology.ts'
      - 'src/lib/ait-ontology.spec.ts'
      - 'src/lib/glass-onion-layer.ts'
      - 'src/index.ts'
      - 'ecosystem/ait-ontology.json'
      - 'docs/AIT_ONTOLOGY.md'
      - '.github/workflows/ait-ontology.yml'
  pull_request:
    paths:
      - 'src/lib/ait-ontology.ts'
      - 'src/lib/ait-ontology.spec.ts'
      - 'src/lib/glass-onion-layer.ts'
      - 'src/index.ts'
      - 'ecosystem/ait-ontology.json'
      - 'docs/AIT_ONTOLOGY.md'
      - '.github/workflows/ait-ontology.yml'

jobs:
  ait-ontology:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build:main
      - name: Unit tests
        run: yarn test:unit
      - name: AIT ontology contract lock
        run: |
          node <<'NODE'
          const assert = require('assert');
          const {
            AIT_ONTOLOGY,
            AIT_SOURCE_BINDING,
            createAITSeed,
            evaluateAITAction,
            validateAITSourceBinding
          } = require('./dist/main/lib/ait-ontology');
          const { GLASS_ONION_LAYER, routeGlassOnion } = require('./dist/main/lib/glass-onion-layer');
          assert.equal(AIT_ONTOLOGY.command, '/glass ait');
          assert.ok(AIT_ONTOLOGY.objectTypes.includes('AIT_EVIDENCE'));
          assert.ok(AIT_ONTOLOGY.relationTypes.includes('CORROBORATES'));
          const binding = validateAITSourceBinding(AIT_SOURCE_BINDING);
          assert.equal(binding.status, 'BOUND');
          assert.equal(binding.sourceId, 'xunia:glass-onion:ait');
          assert.equal(binding.repository, 'sonoxo/xuniadao');
          assert.equal(binding.baselineCommit, '041dcc38b4a2f751b0b9e2c8d2488931ddeb6f5e');
          const seed = createAITSeed();
          assert.equal(seed.objects.length, 5);
          assert.equal(seed.relations.length, 4);
          assert.ok(seed.objects.some(x => x.id === 'ait:source:xunia-binding'));
          assert.equal(evaluateAITAction({ action: 'ANALYZE', objectIds: ['ait:system:glass-onion'] }).decision, 'ALLOW');
          assert.equal(evaluateAITAction({ action: 'MOVE', objectIds: ['ait:action:test'], movesFunds: true }).decision, 'BLOCK');
          assert.ok(GLASS_ONION_LAYER.capabilities.includes('AIT_ONTOLOGY'));
          const route = routeGlassOnion({
            objective: 'Route bound AIT intelligence',
            capability: 'AIT_ONTOLOGY',
            targets: ['xunia', 'sonoxo', 'va3lm', 'zyra'],
            provenance: binding.provenance
          });
          assert.equal(route.decision, 'ALLOW');
          assert.ok(route.pipeline.includes('AIT_CORRELATE'));
          console.log('AIT ONTOLOGY BINDING LOCK: PASS');
          NODE
      - name: Machine contract lock
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const contract = JSON.parse(fs.readFileSync('ecosystem/ait-ontology.json', 'utf8'));
          assert.equal(contract.id, 'AIT-ONTOLOGY');
          assert.equal(contract.command, '/glass ait');
          assert.deepEqual(contract.decisionStates, ['ALLOW', 'REVIEW', 'BLOCK']);
          assert.equal(contract.invariants.provenanceRequired, true);
          assert.equal(contract.invariants.sourceBindingRequired, true);
          assert.equal(contract.invariants.automaticFundMovement, false);
          assert.equal(contract.sourceBinding.status, 'BOUND');
          assert.equal(contract.sourceBinding.repository, 'sonoxo/xuniadao');
          assert.equal(contract.externalAITBinding.status, 'BOUND');
          assert.equal(contract.externalAITBinding.externalAffiliationClaim, false);
          for (const path of [
            contract.sourceBinding.contractPath,
            contract.sourceBinding.implementationPath,
            contract.sourceBinding.verificationWorkflow
          ]) {
            assert.ok(fs.existsSync(path), `missing bound source path: ${path}`);
          }
          console.log('AIT MACHINE BINDING CONTRACT: PASS');
          NODE
