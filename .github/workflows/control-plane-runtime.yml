name: Control Plane Runtime

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/control-plane-runtime.ts'
      - 'src/lib/control-plane-runtime.spec.ts'
      - 'src/lib/action-proof.ts'
      - 'src/lib/action-proof.spec.ts'
      - 'src/lib/action-safety.ts'
      - 'src/lib/action-safety.spec.ts'
      - 'src/lib/guarded-action-runner.ts'
      - 'src/lib/guarded-action-runner.spec.ts'
      - 'src/index.ts'
      - '.github/workflows/control-plane-runtime.yml'
  pull_request:
    paths:
      - 'src/lib/control-plane-runtime.ts'
      - 'src/lib/control-plane-runtime.spec.ts'
      - 'src/lib/action-proof.ts'
      - 'src/lib/action-proof.spec.ts'
      - 'src/lib/action-safety.ts'
      - 'src/lib/action-safety.spec.ts'
      - 'src/lib/guarded-action-runner.ts'
      - 'src/lib/guarded-action-runner.spec.ts'
      - 'src/index.ts'
      - '.github/workflows/control-plane-runtime.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build:main
      - run: yarn test:unit src/lib/control-plane-runtime.spec.ts src/lib/action-proof.spec.ts src/lib/action-safety.spec.ts src/lib/guarded-action-runner.spec.ts
