name: XUNI Game Engine
on:
  push:
    paths: ['gaming/xuni-engine/**', '.github/workflows/xuni-game-engine.yml']
  pull_request:
    paths: ['gaming/xuni-engine/**', '.github/workflows/xuni-game-engine.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gaming/xuni-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify
