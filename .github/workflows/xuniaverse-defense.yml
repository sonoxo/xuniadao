name: XUNIAverse Defense Ontology Lock

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/gcpxunia-defense.ts'
      - 'src/lib/gcpxunia-defense.spec.ts'
      - 'src/lib/tech-peer-ontology.ts'
      - 'src/lib/tech-peer-ontology.spec.ts'
      - 'src/lib/xuniaverse.ts'
      - 'src/lib/xuniaverse.spec.ts'
      - 'src/lib/ecosystem-governance-ontology.ts'
      - 'src/lib/glass-onion-layer.ts'
      - 'src/lib/glass-onion-layer.spec.ts'
      - 'src/lib/mission-telemetry.ts'
      - 'src/index.ts'
      - 'src/lib/xrpl-documentation.ts'
      - 'src/lib/xrpl-documentation.spec.ts'
      - 'src/lib/xrpl-token-wallet-ontology.ts'
      - 'src/lib/xrpl-token-wallet-ontology.spec.ts'
      - 'ecosystem/gcpxunia-defense.json'
      - 'ecosystem/tech-peers.json'
      - 'ecosystem/xuniaverse.json'
      - 'ecosystem/xrpl-documentation.json'
      - 'ecosystem/xrpl-token-wallet.json'
      - 'ecosystem/governance-ontology.json'
      - 'ecosystem/glass-onion-layer.json'
      - 'ecosystem/mission-telemetry.json'
      - 'docs/GCPXUNIA_DEFENSE.md'
      - 'docs/TECH_PEERS.md'
      - 'docs/MISSION_TELEMETRY.md'
      - 'docs/XRPL_INTEGRATION.md'
      - 'docs/XRPL_TOKEN_WALLET_PATHWAYS.md'
      - 'README.md'
      - '.github/workflows/xuniaverse-defense.yml'
  pull_request:
    paths:
      - 'src/lib/gcpxunia-defense.ts'
      - 'src/lib/gcpxunia-defense.spec.ts'
      - 'src/lib/tech-peer-ontology.ts'
      - 'src/lib/tech-peer-ontology.spec.ts'
      - 'src/lib/xuniaverse.ts'
      - 'src/lib/xuniaverse.spec.ts'
      - 'src/lib/ecosystem-governance-ontology.ts'
      - 'src/lib/glass-onion-layer.ts'
      - 'src/lib/glass-onion-layer.spec.ts'
      - 'src/lib/mission-telemetry.ts'
      - 'src/index.ts'
      - 'src/lib/xrpl-documentation.ts'
      - 'src/lib/xrpl-documentation.spec.ts'
      - 'src/lib/xrpl-token-wallet-ontology.ts'
      - 'src/lib/xrpl-token-wallet-ontology.spec.ts'
      - 'ecosystem/gcpxunia-defense.json'
      - 'ecosystem/tech-peers.json'
      - 'ecosystem/xuniaverse.json'
      - 'ecosystem/xrpl-documentation.json'
      - 'ecosystem/xrpl-token-wallet.json'
      - 'ecosystem/governance-ontology.json'
      - 'ecosystem/glass-onion-layer.json'
      - 'ecosystem/mission-telemetry.json'
      - 'docs/GCPXUNIA_DEFENSE.md'
      - 'docs/TECH_PEERS.md'
      - 'docs/MISSION_TELEMETRY.md'
      - 'docs/XRPL_INTEGRATION.md'
      - 'docs/XRPL_TOKEN_WALLET_PATHWAYS.md'
      - 'README.md'
      - '.github/workflows/xuniaverse-defense.yml'

jobs:
  xuniaverse-defense-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build:main
      - run: yarn test:unit
      - name: Defense ontology contract lock
        run: |
          node <<'NODE'
          const assert = require('assert');
          const fs = require('fs');
          const defense = require('./dist/main/lib/gcpxunia-defense');
          const peers = require('./dist/main/lib/tech-peer-ontology');
          const universe = require('./dist/main/lib/xuniaverse');
          const layer = require('./dist/main/lib/glass-onion-layer');
          const mission = require('./dist/main/lib/mission-telemetry');
          const xrpl = require('./dist/main/lib/xrpl-token-wallet-ontology');
          const defenseContract = JSON.parse(fs.readFileSync('ecosystem/gcpxunia-defense.json', 'utf8'));
          const peerContract = JSON.parse(fs.readFileSync('ecosystem/tech-peers.json', 'utf8'));
          const universeContract = JSON.parse(fs.readFileSync('ecosystem/xuniaverse.json', 'utf8'));
          const governance = JSON.parse(fs.readFileSync('ecosystem/governance-ontology.json', 'utf8'));
          const missionContract = JSON.parse(fs.readFileSync('ecosystem/mission-telemetry.json', 'utf8'));
          const xrplContract = JSON.parse(fs.readFileSync('ecosystem/xrpl-token-wallet.json', 'utf8'));
          assert.equal(defense.GCPXUNIA_DEFENSE_ONTOLOGY.command, '/glass defense');
          assert.equal(defenseContract.controls.shortLivedCredentialsRequired, true);
          assert.equal(defenseContract.controls.sharedAgentCredentialsBlocked, true);
          assert.equal(peers.TECH_PEER_ONTOLOGY.command, '/glass peers');
          assert.equal(peerContract.credentialPolicy.affiliationMustNotBeInferred, true);
          assert.equal(universe.XUNIAVERSE.rootRepository, 'sonoxo/xuniadao');
          assert.equal(universe.XUNIAVERSE_REPOSITORIES.length, universeContract.repositoryCount);
          assert.ok(universeContract.repositories.includes('sonoxo/xrpl-dev-portalXUNIA'));
          assert.ok(universeContract.repositories.includes('sonoxo/XRPL-StandardsXUNIA-'));
          assert.ok(universeContract.repositories.includes('sonoxo/xrpl.jsXUNIA'));
          assert.ok(universeContract.repositories.includes('sonoxo/rippledXUNIA'));
          assert.equal(xrpl.XRPL_TOKEN_WALLET_ONTOLOGY.command, '/glass xrpl pathways');
          assert.equal(xrplContract.controls.humanApprovalRequiredForSigning, true);
          assert.equal(xrplContract.controls.privateKeyStorage, false);
          assert.equal(xrplContract.controls.automaticFundMovement, false);
          assert.ok(governance.objectTypes.includes('AGENT_IDENTITY'));
          assert.ok(governance.objectTypes.includes('TECH_PEER'));
          assert.ok(governance.objectTypes.includes('XUNIAVERSE_NODE'));
          assert.equal(layer.GLASS_ONION_LAYER.version, '2.7.0');
          assert.equal(layer.GLASS_ONION_LAYER.defenseCommand, '/glass defense');
          assert.equal(layer.GLASS_ONION_LAYER.peersCommand, '/glass peers');
          assert.equal(layer.GLASS_ONION_LAYER.xuniaverseCommand, '/glass xuniaverse');
          assert.equal(layer.GLASS_ONION_LAYER.missionCommand, '/glass mission');
          assert.equal(mission.evaluateMissionTelemetryAction('FLIGHT_COMMAND').decision, 'BLOCK');
          assert.equal(missionContract.controls.realWorldFlightControl, false);
          console.log('XUNIAVERSE DEFENSE ONTOLOGY: PASS');
          NODE
