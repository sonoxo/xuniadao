name: "XUNIA Resilience Atlas JUPITER Gate"

on:
  push:
    paths:
      - "apps/resilience-atlas/**"
      - "ontology/civil-defense-simulation.schema.json"
      - "scripts/validate-civil-defense-scenario.mjs"
      - ".github/workflows/resilience-atlas.yml"
  pull_request:
    paths:
      - "apps/resilience-atlas/**"
      - "ontology/civil-defense-simulation.schema.json"
      - "scripts/validate-civil-defense-scenario.mjs"
      - ".github/workflows/resilience-atlas.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Validate Resilience Atlas Platform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax and service checks
        working-directory: apps/resilience-atlas
        run: npm run check
      - name: Platform tests
        working-directory: apps/resilience-atlas
        run: npm test
      - name: Validate JSON contracts
        run: node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('apps/resilience-atlas/jupiter.manifest.json','utf8')); JSON.parse(fs.readFileSync('ontology/civil-defense-simulation.schema.json','utf8')); console.log('json contracts: ok')"
      - name: Guardrail regression check
        run: node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('apps/resilience-atlas/jupiter.manifest.json','utf8')); const req=['target-selection','weapon-design','yield-optimization','burst-optimization','strike-sequencing','casualty-maximization']; for(const x of req){if(!m.guardrails.prohibited.includes(x)) throw new Error('missing prohibited capability '+x)} if(m.guardrails.autonomousPublicAlerting!==false||m.guardrails.autonomousResponderDispatch!==false) throw new Error('autonomous operational actions must remain disabled'); console.log('guardrails: ok')"
