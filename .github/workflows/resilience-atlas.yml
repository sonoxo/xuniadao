name: XUNIA Resilience Atlas JUPITER Gate

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check platform
        working-directory: apps/resilience-atlas
        run: npm run check
      - name: Test platform
        working-directory: apps/resilience-atlas
        run: npm test
      - name: Validate contracts
        run: |
          node -e "JSON.parse(require('fs').readFileSync('apps/resilience-atlas/jupiter.manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('ontology/civil-defense-simulation.schema.json','utf8'))"
      - name: Verify guardrails
        run: |
          node -e "const m=JSON.parse(require('fs').readFileSync('apps/resilience-atlas/jupiter.manifest.json','utf8')); const r=['target-selection','weapon-design','yield-optimization','burst-optimization','strike-sequencing','casualty-maximization']; for(const x of r) if(!m.guardrails.prohibited.includes(x)) throw new Error('missing '+x); if(m.guardrails.autonomousPublicAlerting!==false || m.guardrails.autonomousResponderDispatch!==false) throw new Error('autonomous operations disabled policy missing')"
