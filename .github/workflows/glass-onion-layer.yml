name: Glass Onion Layer Lock

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/glass-onion-layer.ts'
      - 'src/lib/glass-onion-layer.spec.ts'
      - 'ecosystem/glass-onion-layer.json'
      - 'docs/GLASSONION_LAYER.md'
      - 'src/index.ts'
      - '.github/workflows/glass-onion-layer.yml'
  pull_request:
    paths:
      - 'src/lib/glass-onion-layer.ts'
      - 'src/lib/glass-onion-layer.spec.ts'
      - 'ecosystem/glass-onion-layer.json'
      - 'docs/GLASSONION_LAYER.md'
      - 'src/index.ts'
      - '.github/workflows/glass-onion-layer.yml'

jobs:
  layer-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build:main

      - name: Unit tests
        run: yarn test:unit

      - name: Glass Onion command lock
        run: |
          node <<'NODE'
          const assert = require('assert');
          const { GLASS_ONION_LAYER, routeGlassOnion } = require('./dist/main/lib/glass-onion-layer');
          assert.equal(GLASS_ONION_LAYER.codename, 'GLASS ONION');
          assert.equal(GLASS_ONION_LAYER.command, '/glass');
          assert.equal(GLASS_ONION_LAYER.layers.length, 5);
          assert.equal(routeGlassOnion({
            objective: 'CI ontology route',
            capability: 'ONTOLOGY_WORKFLOW',
            targets: ['xunia', 'sonoxo', 'va3lm', 'zyra']
          }).decision, 'ALLOW');
          assert.equal(routeGlassOnion({
            objective: 'CI mutation route',
            capability: 'CODE_PLAN',
            targets: ['xunia', 'zyra'],
            mutatesRepository: true
          }).decision, 'REVIEW');
          assert.equal(routeGlassOnion({
            objective: 'CI prohibited route',
            capability: 'CADENCE_FLOW',
            targets: ['xunia'],
            movesFunds: true
          }).decision, 'BLOCK');
          console.log('GLASS ONION LAYER LOCK: PASS');
          NODE

      - name: Machine contract lock
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const contract = JSON.parse(fs.readFileSync('ecosystem/glass-onion-layer.json', 'utf8'));
          assert.equal(contract.codename, 'GLASS ONION');
          assert.equal(contract.version, '2.0.0');
          assert.equal(contract.command, '/glass');
          assert.equal(contract.layers.length, 5);
          assert.equal(contract.invariants.provenanceRequired, true);
          assert.equal(contract.invariants.automaticFundMovement, false);
          console.log('GLASS ONION MACHINE CONTRACT: PASS');
          NODE
