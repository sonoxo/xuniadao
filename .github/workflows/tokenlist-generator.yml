name: GPT-DOUG-LIVE-UPSTREAM-SYNC

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gpt-doug-live-upstream-sync
  cancel-in-progress: false

jobs:
  sync-and-generate:
    name: Sync Flow registry and generate token lists
    runs-on: ubuntu-latest
    steps:
      - name: Checkout XuniaDAO
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout FlowFans upstream registry
        uses: actions/checkout@v4
        with:
          repository: FlowFans/flow-token-list
          ref: main
          path: .upstream/flow-token-list
          fetch-depth: 1

      - name: Record upstream provenance
        shell: bash
        run: |
          set -euo pipefail
          git -C .upstream/flow-token-list rev-parse HEAD > .upstream-flow-token-list.sha
          echo "FlowFans/flow-token-list@$(cat .upstream-flow-token-list.sha)"

      - name: Sync upstream token registry into XuniaDAO mirror
        shell: bash
        run: |
          set -euo pipefail
          test -d .upstream/flow-token-list/token-registry
          rm -rf token-registry
          mkdir -p token-registry
          cp -a .upstream/flow-token-list/token-registry/. token-registry/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Install schema validation dependency
        run: python -m pip install jsonschema==4.23.0

      - name: Generate Flow token lists
        run: node src/utils/tokenlist-generator.js

      - name: Format generated token lists
        run: yarn prettier --write src/tokens/*.json

      - name: Validate generated token lists
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft7Validator

          schema_path = Path('src/schemas/tokenlist.schema.json')
          token_schema_path = Path('src/schemas/token.schema.json')
          schema = json.loads(schema_path.read_text())
          token_schema = json.loads(token_schema_path.read_text())
          schema.pop('$id', None)
          token_schema.pop('$id', None)
          schema['properties']['tokens']['items'] = token_schema
          validator = Draft7Validator(schema)

          for token_list_path in (
            Path('src/tokens/flow-mainnet.tokenlist.json'),
            Path('src/tokens/flow-testnet.tokenlist.json'),
          ):
            token_list = json.loads(token_list_path.read_text())
            errors = sorted(validator.iter_errors(token_list), key=lambda error: list(error.path))
            if errors:
              first = errors[0]
              location = '.'.join(str(part) for part in first.path) or '<root>'
              raise SystemExit(f'{token_list_path}: {first.message} at {location}')
          PY

      - name: Detect synchronized changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- token-registry src/tokens .upstream-flow-token-list.sha; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create XuniaDAO sync pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 'sync(flow): GPT-Doug live upstream token registry'
          body: |
            Automated GPT-Doug-LLM upstream synchronization from `FlowFans/flow-token-list`.

            - Mirrors the upstream `token-registry/`
            - Records the exact upstream commit SHA
            - Regenerates Flow mainnet/testnet token lists
            - Validates generated token lists against XuniaDAO schema before proposing changes

            Upstream contributions remain PR-based; this workflow never direct-pushes to FlowFans/OnFlow repositories.
          labels: TokenList
          branch: 'gpt-doug/flow-upstream-sync'
          branch-suffix: timestamp
          delete-branch: true
          base: main
